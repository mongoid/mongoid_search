name: Test

on: [push, pull_request]

jobs:
  test:

    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '3.0', mongo: 'mongo:4.4', mongoid: '6' }
          - { ruby: '3.1', mongo: 'mongo:5.0', mongoid: '7' }
          - { ruby: '3.2', mongo: 'mongo:6.0', mongoid: '8' }
          - { ruby: '3.3', mongo: 'mongo:7.0', mongoid: '9' }
          - { ruby: '3.4', mongo: 'mongo:8.0', mongoid: '9' }
          - { ruby: '4.0', mongo: 'mongo:8.0', mongoid: '9' }
        experimental: [false]

    name: test (ruby=${{ matrix.entry.ruby }}, mongo=${{ matrix.entry.mongo }}, mongoid=${{ matrix.entry.mongoid }})
    runs-on: ubuntu-latest

    continue-on-error: ${{ matrix.experimental }}

    services:
      mongo:
        image: ${{ matrix.entry.mongo }}
        ports: ["27017:27017"]

    env:
      MONGOID_VERSION: ${{ matrix.entry.mongoid }}
      COVERAGE: ${{ matrix.entry.ruby == '3.4' }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.entry.ruby }}
        bundler-cache: true

    - name: Run tests
      run: bundle exec rspec

    - name: Coveralls
      if: matrix.entry.ruby == '3.4'
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: coverage/.resultset.json
        format: simplecov
